name: Check subscriptions

on:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

concurrency:
  group: subscription-delivery
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger subscription check
        env:
          ATLANTIS_URL: ${{ secrets.ATLANTIS_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          test -n "$ATLANTIS_URL"
          health="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 180 "${ATLANTIS_URL}/api/health")"
          state="$(node -e 'const body=JSON.parse(process.argv[1]);if(typeof body.capabilities?.subscriptions !== "boolean") process.exit(1);process.stdout.write(body.capabilities.subscriptions ? "enabled" : "disabled")' "$health")"
          if [ "$state" = disabled ]; then
            echo 'Price alerts disabled; delivery check skipped.'
            exit 0
          fi
          test -n "$JOB_SECRET"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 \
            -X POST "${ATLANTIS_URL}/api/jobs/check-subscriptions" \
            -H "x-job-secret: ${JOB_SECRET}")"
          node -e '
            const result = JSON.parse(process.argv[1]);
            if (!Number.isInteger(result.checked) || !Number.isInteger(result.matched)) process.exit(1);
            console.log(`Checked ${result.checked}; matched ${result.matched}.`);
          ' "$response"
