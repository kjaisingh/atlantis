services:
  - type: web
    name: Atlantis
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SERPAPI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALERTS_ENABLED
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: APP_URL
        value: https://atlantis-xoxe.onrender.com
      - key: JOB_SECRET
        sync: false
