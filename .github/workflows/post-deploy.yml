name: Verify deployment

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-production
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for matching Render deployment
        env:
          ATLANTIS_URL: ${{ secrets.ATLANTIS_URL }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..30}; do
            health="$(curl --silent --show-error --max-time 30 "${ATLANTIS_URL}/api/health" || true)"
            if node -e 'const h=JSON.parse(process.argv[1]);const c=h.capabilities;process.exit(h.status === "ok" && h.version === process.env.EXPECTED_SHA && typeof c?.search === "boolean" && typeof c?.subscriptions === "boolean" && typeof c?.databaseConfigured === "boolean" ? 0 : 1)' "$health" 2>/dev/null; then
              curl --fail --silent --show-error --max-time 30 "${ATLANTIS_URL}/" >/dev/null
              curl --fail --silent --show-error --max-time 30 "${ATLANTIS_URL}/api/airports" >/dev/null
              echo "Deployment verified at ${EXPECTED_SHA}."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for Render to deploy ${EXPECTED_SHA}." >&2
          exit 1
